[project]
name = "chrome-tab-consolidator"
version = "1.0.0"
description = "Remove duplicate tabs across Chrome windows"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "websocket-client>=1.6.0",
]

[project.scripts]
backup-tabs = "backup_tabs:main"
restore-tabs = "restore_tabs:main"
restore-history = "restore_from_history:main"
consolidate-tabs = "consolidate_tabs:main"
organize-tabs = "organize_tabs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
