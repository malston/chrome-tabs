[project]
name = "chrome-tab-manager"
version = "2.0.0"
description = "Chrome tab management: organize by domain, deduplicate, and recover from history"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "websocket-client>=1.6.0",
]

[project.scripts]
restore-history = "restore_from_history:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
