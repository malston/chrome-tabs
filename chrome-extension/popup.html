<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Organizer</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #202124;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .primary {
      background-color: #1a73e8;
      color: white;
    }

    .primary:hover {
      background-color: #1557b0;
    }

    .secondary {
      background-color: #f1f3f4;
      color: #202124;
    }

    .secondary:hover {
      background-color: #e8eaed;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      background-color: #e8f0fe;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background-color: #e6f4ea;
      color: #137333;
    }

    .status.error {
      background-color: #fce8e6;
      color: #c5221f;
    }

    .footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e8eaed;
      font-size: 12px;
      color: #5f6368;
      text-align: center;
    }

    .bookmark-selector {
      margin-top: 16px;
      padding: 16px;
      background-color: #f8f9fa;
      border-radius: 4px;
      border: 1px solid #e8eaed;
    }

    .bookmark-selector h2 {
      font-size: 14px;
      margin: 0 0 12px 0;
      color: #202124;
    }

    .bookmark-selector select {
      width: 100%;
      padding: 8px;
      border: 1px solid #e8eaed;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 12px;
      background-color: white;
    }

    .bookmark-selector select option {
      padding: 8px;
    }

    .selector-buttons {
      display: flex;
      gap: 8px;
    }

    .selector-buttons button {
      flex: 1;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <h1>Tab Organizer</h1>

  <button id="organizeBtn" class="primary">
    Organize by Domain
  </button>

  <button id="organizeCategoryBtn" class="primary">
    Organize by Category
  </button>

  <button id="organizeAllWindowsBtn" class="primary">
    Organize All Windows by Domain
  </button>

  <button id="organizeAllWindowsCategoryBtn" class="primary">
    Organize All Windows by Category
  </button>

  <button id="dedupeBtn" class="primary">
    Remove Duplicates
  </button>

  <button id="saveBookmarksBtn" class="primary">
    Save to Bookmarks
  </button>

  <button id="restoreBookmarksBtn" class="primary">
    Restore from Bookmarks
  </button>

  <button id="removeGroupsBtn" class="secondary">
    Remove All Groups
  </button>

  <div id="status" class="status"></div>

  <div id="bookmarkSelector" class="bookmark-selector" style="display: none;">
    <h2>Select Bookmark Folder</h2>
    <select id="folderSelect" size="5"></select>
    <div class="selector-buttons">
      <button id="restoreSelectedBtn" class="primary">Restore</button>
      <button id="cancelSelectBtn" class="secondary">Cancel</button>
    </div>
  </div>

  <div class="footer">
    Organize and deduplicate tabs
  </div>

  <script src="popup.js"></script>
</body>
</html>
