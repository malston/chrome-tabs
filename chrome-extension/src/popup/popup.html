<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Organizer</title>
  <style>
    :root {
      /* Spacing */
      --spacing-xs: 4px;
      --spacing-sm: 6px;
      --spacing-md: 8px;
      --spacing-lg: 10px;
      --spacing-xl: 12px;
      --spacing-2xl: 16px;

      /* Font sizes */
      --font-size-xs: 9px;
      --font-size-sm: 10px;
      --font-size-md: 11px;
      --font-size-base: 12px;
      --font-size-lg: 13px;
      --font-size-xl: 16px;

      /* Light mode colors (default) */
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --bg-tertiary: #f1f3f4;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --border-color: #e8eaed;
      --primary-color: #1a73e8;
      --primary-hover: #1557b0;
      --secondary-bg: #34a853;
      --secondary-hover: #2d9249;
      --status-bg: #e8f0fe;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --error-bg: #fce8e6;
      --error-text: #c5221f;
      --select-bg: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #202124;
        --bg-secondary: #292a2d;
        --bg-tertiary: #3c4043;
        --text-primary: #e8eaed;
        --text-secondary: #9aa0a6;
        --border-color: #5f6368;
        --primary-color: #8ab4f8;
        --primary-hover: #aecbfa;
        --secondary-bg: #81c995;
        --secondary-hover: #a8dab5;
        --status-bg: #394457;
        --success-bg: #1e3a2f;
        --success-text: #81c995;
        --error-bg: #442c2e;
        --error-text: #f28b82;
        --select-bg: #292a2d;
      }
    }

    body {
      width: 280px;
      padding: var(--spacing-xl);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    h1 {
      font-size: var(--font-size-xl);
      margin: 0 0 var(--spacing-md) 0;
      color: var(--text-primary);
    }

    button {
      width: 100%;
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-xs);
      border: none;
      border-radius: var(--spacing-xs);
      font-size: var(--font-size-lg);
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .primary {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      .primary {
        color: #202124;
      }
    }

    .primary:hover {
      background-color: var(--primary-hover);
    }

    .secondary {
      background-color: var(--secondary-bg);
      color: #ffffff;
    }

    .secondary:hover {
      background-color: var(--secondary-hover);
    }

    @media (prefers-color-scheme: dark) {
      .secondary {
        color: #202124;
      }
    }

    .status {
      margin-top: var(--spacing-md);
      padding: var(--spacing-md);
      background-color: var(--status-bg);
      border-radius: var(--spacing-xs);
      font-size: var(--font-size-base);
      display: none;
      color: var(--text-primary);
    }

    .status.show {
      display: block;
    }

    .status.success {
      background-color: var(--success-bg);
      color: var(--success-text);
    }

    .status.error {
      background-color: var(--error-bg);
      color: var(--error-text);
    }

    .footer {
      margin-top: var(--spacing-md);
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--border-color);
      font-size: var(--font-size-md);
      color: var(--text-secondary);
      text-align: center;
    }

    .section-header {
      font-size: var(--font-size-sm);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin: var(--spacing-2xl) 0 var(--spacing-sm) 0;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--border-color);
    }

    .section-header:first-of-type {
      margin-top: 0;
    }

    .subsection-header {
      font-size: var(--font-size-xs);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-secondary);
      margin: var(--spacing-md) 0 var(--spacing-xs) 0;
      opacity: 0.8;
    }

    .settings-link {
      display: inline;
      color: var(--primary-color);
      text-decoration: none;
      font-size: var(--font-size-md);
    }

    .settings-link:hover {
      text-decoration: underline;
    }

    .bookmark-selector {
      margin-top: var(--spacing-lg);
      padding: var(--spacing-lg);
      background-color: var(--bg-secondary);
      border-radius: var(--spacing-xs);
      border: 1px solid var(--border-color);
    }

    .bookmark-selector h2 {
      font-size: var(--font-size-lg);
      margin: 0 0 var(--spacing-md) 0;
      color: var(--text-primary);
    }

    .bookmark-selector select {
      width: 100%;
      padding: var(--spacing-sm);
      border: 1px solid var(--border-color);
      border-radius: var(--spacing-xs);
      font-size: var(--font-size-base);
      margin-bottom: var(--spacing-md);
      background-color: var(--select-bg);
      color: var(--text-primary);
    }

    .bookmark-selector select option {
      padding: var(--spacing-md);
      background-color: var(--select-bg);
      color: var(--text-primary);
    }

    .bookmark-selector select option:checked {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      .bookmark-selector select option:checked {
        color: #202124;
      }
    }

    .selector-buttons {
      display: flex;
      gap: var(--spacing-md);
    }

    .selector-buttons button {
      flex: 1;
      margin-bottom: 0;
    }

    .selector-label {
      font-size: var(--font-size-md);
      display: block;
      margin-bottom: var(--spacing-xs);
    }

    .protected-groups-container {
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: var(--spacing-xl);
    }
  </style>
</head>
<body>
  <h1>Tab Organizer</h1>

  <div class="section-header" role="heading" aria-level="2">Current Window</div>

  <div class="subsection-header" role="heading" aria-level="3">Manage Tabs</div>

  <button id="organizeCategoryBtn" class="primary">
    Organize by Category
  </button>

  <button id="organizeBtn" class="primary">
    Organize by Domain
  </button>

  <button id="dedupeBtn" class="primary">
    Remove Duplicates
  </button>

  <button id="saveBookmarksBtn" class="primary">
    Save to Bookmarks
  </button>

  <button id="restoreBookmarksBtn" class="primary">
    Restore from Bookmarks
  </button>

  <div class="subsection-header" role="heading" aria-level="3">Manage Groups</div>

  <button id="combineGroupsBtn" class="secondary">
    Combine Groups
  </button>

  <button id="protectGroupBtn" class="secondary">
    Protect Groups
  </button>

  <button id="removeGroupsBtn" class="secondary">
    Remove All Groups
  </button>

  <div class="section-header" role="heading" aria-level="2">All Active Windows</div>

  <div class="subsection-header" role="heading" aria-level="3">Manage Tabs</div>

  <button id="organizeAllWindowsCategoryBtn" class="primary">
    Organize by Category
  </button>

  <button id="organizeAllWindowsBtn" class="primary">
    Organize by Domain
  </button>

  <div id="status" class="status"></div>

  <div id="bookmarkSelector" class="bookmark-selector" style="display: none;">
    <h2>Select Bookmark Folder</h2>
    <select id="folderSelect" size="5"></select>
    <div class="selector-buttons">
      <button id="restoreSelectedBtn" class="primary">Restore</button>
      <button id="cancelSelectBtn" class="secondary">Cancel</button>
    </div>
  </div>

  <div id="combineGroupsSelector" class="bookmark-selector" style="display: none;">
    <h2>Combine Tab Groups</h2>
    <label for="sourceGroupSelect" class="selector-label">Merge these groups (Cmd/Ctrl+click for multiple):</label>
    <select id="sourceGroupSelect" size="4" multiple></select>
    <label for="targetGroupSelect" class="selector-label">Into this group:</label>
    <select id="targetGroupSelect" size="4"></select>
    <div class="selector-buttons">
      <button id="combineSelectedBtn" class="primary">Combine</button>
      <button id="cancelCombineBtn" class="secondary">Cancel</button>
    </div>
  </div>

  <div id="protectGroupSelector" class="bookmark-selector" style="display: none;">
    <h2>Protect Tab Groups</h2>
    <label for="protectGroupSelect" class="selector-label">Select groups to protect (Cmd/Ctrl+click for multiple):</label>
    <select id="protectGroupSelect" size="4" multiple></select>
    <div class="selector-buttons">
      <button id="protectSelectedBtn" class="primary">Protect</button>
      <button id="cancelProtectBtn" class="secondary">Cancel</button>
    </div>
  </div>

  <div id="protectedGroupsList" class="bookmark-selector" style="display: none;">
    <h2>Protected Groups</h2>
    <div id="protectedGroupsContainer" class="protected-groups-container"></div>
    <div class="selector-buttons">
      <button id="closeProtectedListBtn" class="secondary">Close</button>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="settingsLink" class="settings-link">Category Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
