<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Organizer</title>
  <style>
    :root {
      /* Light mode colors (default) */
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --bg-tertiary: #f1f3f4;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --border-color: #e8eaed;
      --primary-color: #1a73e8;
      --primary-hover: #1557b0;
      --secondary-bg: #f1f3f4;
      --secondary-hover: #e8eaed;
      --status-bg: #e8f0fe;
      --success-bg: #e6f4ea;
      --success-text: #137333;
      --error-bg: #fce8e6;
      --error-text: #c5221f;
      --select-bg: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #202124;
        --bg-secondary: #292a2d;
        --bg-tertiary: #3c4043;
        --text-primary: #e8eaed;
        --text-secondary: #9aa0a6;
        --border-color: #5f6368;
        --primary-color: #8ab4f8;
        --primary-hover: #aecbfa;
        --secondary-bg: #3c4043;
        --secondary-hover: #5f6368;
        --status-bg: #394457;
        --success-bg: #1e3a2f;
        --success-text: #81c995;
        --error-bg: #442c2e;
        --error-text: #f28b82;
        --select-bg: #292a2d;
      }
    }

    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: var(--text-primary);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .primary {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      .primary {
        color: #202124;
      }
    }

    .primary:hover {
      background-color: var(--primary-hover);
    }

    .secondary {
      background-color: var(--secondary-bg);
      color: var(--text-primary);
    }

    .secondary:hover {
      background-color: var(--secondary-hover);
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      background-color: var(--status-bg);
      border-radius: 4px;
      font-size: 13px;
      display: none;
      color: var(--text-primary);
    }

    .status.show {
      display: block;
    }

    .status.success {
      background-color: var(--success-bg);
      color: var(--success-text);
    }

    .status.error {
      background-color: var(--error-bg);
      color: var(--error-text);
    }

    .footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
    }

    .bookmark-selector {
      margin-top: 16px;
      padding: 16px;
      background-color: var(--bg-secondary);
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .bookmark-selector h2 {
      font-size: 14px;
      margin: 0 0 12px 0;
      color: var(--text-primary);
    }

    .bookmark-selector select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 12px;
      background-color: var(--select-bg);
      color: var(--text-primary);
    }

    .bookmark-selector select option {
      padding: 8px;
      background-color: var(--select-bg);
      color: var(--text-primary);
    }

    .bookmark-selector select option:checked {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      .bookmark-selector select option:checked {
        color: #202124;
      }
    }

    .selector-buttons {
      display: flex;
      gap: 8px;
    }

    .selector-buttons button {
      flex: 1;
      margin-bottom: 0;
    }

    .advanced-section {
      margin-top: 16px;
      padding-top: 12px;
    }

    .section-divider {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <h1>Tab Organizer</h1>

  <button id="organizeBtn" class="primary">
    Organize by Domain
  </button>

  <button id="organizeCategoryBtn" class="primary">
    Organize by Category
  </button>

  <button id="organizeAllWindowsBtn" class="primary">
    Organize All Windows by Domain
  </button>

  <button id="organizeAllWindowsCategoryBtn" class="primary">
    Organize All Windows by Category
  </button>

  <button id="dedupeBtn" class="primary">
    Remove Duplicates
  </button>

  <button id="saveBookmarksBtn" class="primary">
    Save to Bookmarks
  </button>

  <button id="restoreBookmarksBtn" class="primary">
    Restore from Bookmarks
  </button>

  <button id="combineGroupsBtn" class="secondary">
    Combine Groups
  </button>

  <button id="protectGroupBtn" class="secondary">
    Protect Groups
  </button>

  <button id="removeGroupsBtn" class="secondary">
    Remove All Groups
  </button>

  <div id="advancedSection" class="advanced-section" style="display: none;">
    <div class="section-divider">Advanced</div>
    <button id="mergeDuplicatesBtn" class="secondary">
      Merge Duplicate Groups
    </button>
  </div>

  <div id="status" class="status"></div>

  <div id="bookmarkSelector" class="bookmark-selector" style="display: none;">
    <h2>Select Bookmark Folder</h2>
    <select id="folderSelect" size="5"></select>
    <div class="selector-buttons">
      <button id="restoreSelectedBtn" class="primary">Restore</button>
      <button id="cancelSelectBtn" class="secondary">Cancel</button>
    </div>
  </div>

  <div id="combineGroupsSelector" class="bookmark-selector" style="display: none;">
    <h2>Combine Tab Groups</h2>
    <label for="sourceGroupSelect" style="font-size: 13px; display: block; margin-bottom: 4px;">Merge these groups (Cmd/Ctrl+click for multiple):</label>
    <select id="sourceGroupSelect" size="4" multiple></select>
    <label for="targetGroupSelect" style="font-size: 13px; display: block; margin-bottom: 4px;">Into this group:</label>
    <select id="targetGroupSelect" size="4"></select>
    <div class="selector-buttons">
      <button id="combineSelectedBtn" class="primary">Combine</button>
      <button id="cancelCombineBtn" class="secondary">Cancel</button>
    </div>
  </div>

  <div id="protectGroupSelector" class="bookmark-selector" style="display: none;">
    <h2>Protect Tab Groups</h2>
    <label for="protectGroupSelect" style="font-size: 13px; display: block; margin-bottom: 4px;">Select groups to protect (Cmd/Ctrl+click for multiple):</label>
    <select id="protectGroupSelect" size="4" multiple></select>
    <div class="selector-buttons">
      <button id="protectSelectedBtn" class="primary">Protect</button>
      <button id="cancelProtectBtn" class="secondary">Cancel</button>
    </div>
  </div>

  <div id="protectedGroupsList" class="bookmark-selector" style="display: none;">
    <h2>Protected Groups</h2>
    <div id="protectedGroupsContainer" style="max-height: 150px; overflow-y: auto; margin-bottom: 12px;"></div>
    <div class="selector-buttons">
      <button id="closeProtectedListBtn" class="secondary">Close</button>
    </div>
  </div>

  <div class="footer">
    Organize and deduplicate tabs
    <br>
    <a href="#" id="settingsLink" style="color: #1a73e8; text-decoration: none;">Category Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
